[package]
name = "helia"
version = "0.0.1"
description = "Helia desktop application"
edition = "2024"
rust-version = "1.90"

[lib]
name = "helia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "helia"
path = "src/main.rs"
required-features = ["desktop"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", default-features = false , features = [] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
time = { version = "0.3", features = ["parsing"] }

[dev-dependencies]
tauri = { version = "2.12", default-features = false, features = ["test"] }

[features]
default = ["desktop"]
desktop = ["tauri/wry", "tauri/compression", "tauri/common-controls-v6", "tauri/dynamic-acl", "tauri/x11", "tauri/dbus"]
