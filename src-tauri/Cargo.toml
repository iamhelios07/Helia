[package]
name = "helia"
version = "0.0.1"
description = "Helia desktop application"
edition = "2024"
rust-version = "1.90"

[lib]
name = "helia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "helia"
path = "src/main.rs"
required-features = ["desktop"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", default-features = false , features = [] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
time = { version = "0.3", features = ["parsing"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
base64 = "0.22"
ring = "0.17"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
tauri = { version = "2.12", default-features = false, features = ["test"] }

[features]
default = ["desktop"]
desktop = ["tauri/wry", "tauri/compression", "tauri/common-controls-v6", "tauri/dynamic-acl", "tauri/x11", "tauri/dbus"]

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
# Complexity and maintainability
cognitive_complexity = "warn"
too_many_lines = "warn"
too_many_arguments = "warn"

# Additional code quality checks
needless_pass_by_value = "warn"
redundant_clone = "warn"